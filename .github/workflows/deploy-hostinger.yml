name: Deploy para Napoleon

on:
  push:
    branches:
      - main # Quando houver push para a branch main, a automação executa

jobs:
  web-deploy:
    name: 🚀 Deploy Napoleon (SFTP)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚚 Baixando os arquivos
        uses: actions/checkout@v4

      - name: 🛠️ Instalando o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalando dependências
        run: npm ci

      - name: 🏗️ Construindo o projeto
        run: npm run build

      - name: 🔍 Inspecionar diretórios no servidor
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          export SSHPASS="${{ secrets.FTP_PASSWORD }}"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p 1157 "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}" "echo '=== DIRETORIO HOME ==='; pwd; ls -la; echo '=== DIRETORIO PUBLIC_HTML ==='; ls -la public_html" > directory_structure.txt 2>&1 || true

      - name: 📤 Commitar e enviar logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add directory_structure.txt || true
          git commit -m "chore: save directory structure log [skip ci]" || true
          git push origin main || true

      - name: 🚀 Enviando para a Napoleon via SFTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-host: ${{ secrets.FTP_SERVER }}
          remote-protocol: sftp
          remote-port: 1157
          remote-user: ${{ secrets.FTP_USERNAME }}
          remote-password: ${{ secrets.FTP_PASSWORD }}
          remote-path: /public_html/
          local-path: ./dist/
          sync: full


