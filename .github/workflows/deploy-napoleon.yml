name: Deploy para Napoleon

on:
  push:
    branches:
      - main # Quando houver push para a branch main, a automação executa

# Comentário para forçar disparo da Action após configuração de Secrets na Napoleon


jobs:
  web-deploy:
    name: 🚀 Deploy Napoleon (SFTP)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Baixando os arquivos
        uses: actions/checkout@v4

      - name: 🛠️ Instalando o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalando dependências
        run: npm ci

      - name: 🏗️ Construindo o projeto
        run: npm run build

      - name: 🔍 SFTP Debug Listing
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          export SSHPASS="${{ secrets.FTP_PASSWORD }}"
          
          # Create sftp batch file
          echo "pwd" > sftp_commands.txt
          echo "ls -la" >> sftp_commands.txt
          echo "ls -la domains" >> sftp_commands.txt
          echo "ls -la domains/trglogistics.com.br" >> sftp_commands.txt
          echo "ls -la domains/trglogistics.com.br/public_html" >> sftp_commands.txt
          
          # Run SFTP and output to sftp_debug.txt in dist/
          sshpass -e sftp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P 1157 "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}" < sftp_commands.txt > ./dist/sftp_debug.txt 2>&1 || true
          
          # Publish log to public anonymous ntfy.sh channel
          curl -H "Title: SFTP Debug Logs" -d @./dist/sftp_debug.txt ntfy.sh/rocket-trg-nitro-logs

      - name: 🚀 Enviando para a Napoleon via SFTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-host: ${{ secrets.FTP_SERVER }}
          remote-protocol: sftp
          remote-port: 1157
          remote-user: ${{ secrets.FTP_USERNAME }}
          remote-password: ${{ secrets.FTP_PASSWORD }}
          remote-path: /home/monl4152/domains/trglogistics.com.br/public_html/
          local-path: ./dist/
          sync: full


